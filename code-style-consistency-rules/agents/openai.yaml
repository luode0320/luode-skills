interface:
  display_name: "风格一致编码"
  short_description: "测试后执行 6-review 风格回归，检查写法、位置、格式与项目习惯"
  default_prompt: "使用 $code-style-consistency-rules 在真实测试完成后执行一次 6-review 风格回归，输出 STYLE: PASS 或 STYLE: FIX_REQUIRED；只检查 UTF-8、换行、尾随空白、命名、注释、日志、可读性、目录归位、依赖方向、测试资产和 PROJECT_STYLE.md，不判断业务正确性、需求覆盖或发布放行。Go 路由函数中同一步骤的批量注册语句统一使用代码块 `{ ... }`，函数内局部变量预声明禁止 var (...) 分组写法，函数签名参数默认单行，参数过多时优先提炼参数结构体。"
