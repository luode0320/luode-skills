interface:
  display_name: "持续代码质量监督"
  short_description: "仅在当前消息要求监控代码且 Goal active、非 Plan Mode 时持续监督"
  default_prompt: "使用 $continuous-code-quality-supervisor-rules；仅当当前 Goal 可确认 active、当前用户消息明确表达监控代码且当前不是 Plan Mode 时启动。Goal 状态不明、历史消息曾表达监控意图或 Plan Mode 均立即退出。启动后读取最新 diff，并复用 $code-style-consistency-rules 的共享静态 Owner 路由；生成去重 finding 并通知实施会话，不复制或改写该路由。"
