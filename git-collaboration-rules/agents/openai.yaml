interface:
  display_name: "Git 协作"
  short_description: "规范提交粒度、分支同步和 PR 整理的规则"
  default_prompt: "使用 $git-collaboration-rules 处理当前 Git 提交流程：分析全部未提交改动并按业务与提交域拆分为多次提交；同一任务默认按 `docs`、`test`、实现 / 修复提交域收敛，需求、实施、Bug、测试说明、6-review、验收与项目状态同步文件合并为同一 `docs` 提交，历史 `doc/6-审查/`、`doc/7-验收/` 只读兼容不参与新产物路由。可执行测试文件（至少根 `test/**`、`*_test.*`、`*.spec.*`、`*.test.*`）归入 `test` 提交，代码实现 / 运行配置单独提交；`doc/5-tests/**` 只保存测试说明、日志、报告、截图和非可执行证据，归入 `docs`。每次提交前只核对当前 staged 改动的范围、格式、注释、敏感信息和既有提交边界。真实测试与 `6-review` 必须由实施计划驱动，Git 提交不生成、替代或放行它们；纯文档提交的无关联源码维度须记录为不适用；若用户请求“提交git”，必须持续提交直到 `git status --short` 为空（除阻断级规则外不得提前结束）；每次提交前同步更新项目根 README 改动日志，并保证提交消息格式与换行合规。"
