interface:
  display_name: "测试程序规则"
  short_description: "统一测试程序职责拆分、根 test 镜像与控制台过程日志"
  default_prompt: "使用 $test-program-rules 判断当前测试程序、模拟程序、验证脚本和数据构造脚本应如何划分职责；真实测试代码、mock、stub、fake、fixture 和 helper 都放在根 test/ 的 ASCII 源码镜像目录，模拟程序与对应测试使用同一源码相对路径，跨源码共享能力才放 test/shared/；doc/5-tests/ 只保存时间戳 README、证据和非可执行产物；测试脚本执行时输出关键过程日志，第三方 API 响应结构不明时先用探测脚本获取样例，再回流结构体建模。"
