interface:
  display_name: "并行与子代理统一分发"
  short_description: "统一判定串行/并行，真实启动并回收子代理"
  default_prompt: "使用 $parallel-task-dispatch-rules 时只运行一次统一状态机：进入前先枚举当前会话全部非根 agent，保留仍需执行者并清理遗留者；再判断串行、条件并行或可并行，评估上下文重复读取与启动成本，冻结主/子职责和互斥写集。每批结束后按执行终态停止或关闭并重新枚举，未关闭数非零时禁止下一批。每次最终回复前再次全量扫描；interrupt_agent、停止采样和完成通知均不算关闭，只有真实资源释放工具成功且复查不再活跃才增加关闭数。平台无关闭能力时仅告警，禁止伪报全部关闭。最终从实例台账对齐计划线程数、实际启动数、完成数、终态数、关闭数、终局扫描数、仍活跃数、未关闭数、告警原因和回退原因。"
