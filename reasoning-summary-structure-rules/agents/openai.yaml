interface:
  display_name: "总结结构闸门"
  short_description: "按 T0/T1/T2 三档输出最终总结并检查结构完整性；一句话结论承载结果+关键数字/文件+验证状态，任何事实最多出现一次；后台异步任务（轮询/CI 等待/长任务）必须先 TaskCreate 登记宿主任务列表（做什么+任务标识+何时查看），再输出「🔄 后台异步任务」分流小节并映射条目"
  plan_mode_exclusion: "Plan Mode 下判定 NOT_APPLICABLE，不读取总结模板、不生成 final_answer；计划出口由 implementation-planning-rules 独占。"
  default_prompt: "使用 $reasoning-summary-structure-rules 在最终回复前执行总结结构闸门检查。先按档位判定确定本轮档位：T0 极简档（单文件修正/简单保存/纯问答/单命令说明等单点任务，改动 ≤1 文件、实质动作 ≤1 步、无独立验证、未命中合规闸门、无偏差）只输出容器（--- + `# 📋 本轮总结` + 状态摘要行）加一句话结论（信息密度主行：结果 + 关键数字/文件 + 验证状态），再按通用尾部顺序接条件尾节；T1 标准档（普通多步任务）输出不超过 4 个主节：一句话结论、执行证据（1-3 条含关键验证）、方案与结果（合并方案/根因/结果，验证并入；存在 ⚠️ 需求理解偏差时在本节末尾附一行偏差说明）、改动点，不输出图形化总览与独立问题/验证小节；T2 完整档（真实阻断、命中 skill-execution-compliance-gate-rules 或 code-change-finalization-gate-rules、需要图形化总览、跨模块改动或用户要求完整结构）输出完整基线主顺序：Skill 命中检查、图形化总览（适用时先图后文，每张图前写图形目的和关联 ID，图内术语与正文及真实证据一致，无法可靠表达时写图形化表达 N/A、原因和证据）、Skill 执行证据、当前要解决的问题（1-2 行：用户原始目标一句话，禁止三行一致性对照表）、解决方案与根因、验证结果、结果与结论（只写一句话结论未覆盖的增量信息，1-2 句最多 3 句）、后台异步任务（条件）。反重复铁律全程生效：任何事实在总结中最多出现一次，禁止跨小节复述；文字风格禁止填充词（此外/总体而言/值得注意的是）与空泛形容（显著提升/大幅优化/完善/丰富），用具体名词和数字表达。后台异步任务（本轮启动了 run_in_background 轮询 / CI 等待 / 长任务等）：必须先 TaskCreate 在宿主任务列表登记，条目描述按「做什么 + 任务标识 + 何时查看」三段式，启动/等待/回收三阶段用 TaskUpdate 推进 pending→in_progress→completed，禁止裸 run_in_background 当唯一进度可见手段；随后输出 `## 🔄 后台异步任务` 小节（T2 位于「结果与结论」之后，T0/T1 位于一句话结论之后的首个条件尾节位置）：任务标识、任务类型、轮询节奏、预计完成信号、结果回流渠道（系统通知 / 下一会话 / 用户指令）、用户等待语义、宿主任务列表映射；该小节是「同步已完成 + 异步在跑」的收口信号，不是未完成、不是阻断、不触发后续内容。若 `knowledge-flow` 的引用台账非空，必须在总结末尾输出「知识引用」小节，用「本轮引用」（序号、笔记、本轮用途）与「本轮沉淀」（序号、笔记、操作、readback）两张表逐条列出，笔记名取自读写笔记时所用相对路径的文件名，笔记状态为 stale/deprecated/retired/conflicted 时在用途列末尾标注警示符号；每行都必须能回指一次成功返回的真实文件读/写调用，台账为空时整节省略，且不在其他小节重复同一事实。真实 `blocked` 或 `manual_handoff` 时，读取 `artifact-delivery-gate-rules/references/task-blocker-closure-contract.md` 并且只由本 skill 在总结最后渲染 `任务阻断收口`：状态、阶段、依据与证据、已尝试与停止条件、影响、1-3 条解决计划、恢复验证/重入点；`limited/not_applicable` 不得触发。阻断时不输出一般后续内容，改动点与知识引用置于阻断区块之前。默认不输出“下一步状态/下一步建议”区块；仅当不存在真实阻断且存在原执行计划内未完成必需项，或用户明确要求后续建议/backlog 时，才允许追加后续内容。若不存在合法后续，强制无下一步并直接收口，不输出“下一步状态/下一步建议/无需继续动作/等待用户新指令”等可能触发循环 loop 的占位文案。若运行环境存在 goal/plan/task 等显式状态收口机制，完成结论前先确认已真实收口。若必填项缺失，先补信息再收口。"
