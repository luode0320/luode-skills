interface:
  display_name: "总结结构闸门"
  short_description: "按 T0/T1/T2 三档输出最终总结；一句话结论承载结果+关键数字/文件+验证状态，任何事实最多出现一次；知识引用台账非空时末尾输出「知识引用」；真实阻断时独占渲染任务阻断收口"
  plan_mode_exclusion: "Plan Mode 下判定 NOT_APPLICABLE，不读取总结模板、不生成 final_answer；计划出口由 implementation-planning-rules 独占。"
  default_prompt: "使用 $reasoning-summary-structure-rules 在最终回复前确定档位并输出总结。T0 极简档（单文件修正/简单保存/纯问答/单命令说明，改动 ≤1 文件、实质动作 ≤1 步、无独立验证、无偏差）：容器（--- + `# 📋 本轮总结`）+ 一句话结论 + 条件尾节。T1 标准档（普通多步任务）：一句话结论、执行证据（1-3 条含关键验证）、方案与结果（方案/根因/结果各一句，含 ⚠️ 偏差行与待裁定四要素闭环）、改动点，主节 ≤ 4 个。T2 完整档（真实阻断、命中 code-change-finalization-gate-rules、需要图形化总览、跨模块改动或用户要求完整结构）：一句话结论、图形化总览（适用时，图前写目的与关联 ID）、执行证据、要解决的问题（1-2 行）、方案与根因、验证结果、结果与结论（只写增量，≤3 句）、后台异步任务（条件）。通用尾部顺序：🖼 生成产物 → 🔄 后台异步任务 → 后续内容（仅合法）→ 📦 改动点 → 📚 知识引用 → ⛔ 任务阻断收口；真实阻断时改动点与知识引用置于阻断区块之前。反重复铁律：任何事实最多出现一次；一句话结论必须含结果、关键数字/文件与验证状态。若 `knowledge-flow` 引用台账非空，必须在总结末尾用「本轮引用」（序号/笔记/本轮用途）与「本轮沉淀」（序号/笔记/操作/readback）两张表输出知识引用，每行回指一次真实返回的文件读/写调用；台账为空时整节省略，且不在其他小节重复。真实 blocked/manual_handoff 时按 task-blocker-closure-contract 渲染任务阻断收口并置于最后，渲染用户授权操作与授权边界。默认不输出下一步区块；仅存在原计划内未完成必需项或用户明确要求时才追加。若宿主任务列表仍有 pending/in_progress 任务且未继续执行也未输出显式中断点，禁止输出已完成式总结。"
