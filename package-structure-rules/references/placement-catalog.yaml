  "allowed_children": {
    "database/sql": ["ddl", "index"],
    "scripts": ["dev", "build"],
    "deploy": ["docker", "compose", "kubernetes", "proxy"],
    "common": ["request", "response", "constant", "error", "validation"],
    "integration": ["contracts", "compose"],
    "integration/contracts": ["http", "event", "rpc"],
    "utils/discovery": ["polaris", "nacos"]
  },
  "adoption_manifest": {
    "version": 1,
    "schema_ref": "#/$defs/adoption_manifest",
    "required_fields": {
      "manifest": ["version", "project_kind", "adopted_paths", "legacy_source_roots"],
      "backend": ["language"],
      "adopted_path": ["path", "catalog_id", "responsibility"],
      "legacy_source_root": ["path", "responsibility", "existing_directories", "existing_files"]
    },
    "path_rules": {
      "relative_only": true,
      "forbid_parent_segments": true,
      "unique_by": {
        "adopted_paths": "path",
        "legacy_source_roots": "path"
      },
      "adopted_paths_must_not_match_catalog_forbidden_paths": true
    }
  },
