version: 2
owner: package-structure-rules
instruction: >-
  先使用 placement_catalog.py query 查询唯一位置；再在返回目录内搜索既有实现；
  不得创建 Catalog 未定义或 strict 禁止的目录。旧项目先读取人工维护的收敛清单，
  已采纳目录继续遵守 Catalog，遗留快照只能维护已有源码。Swag 仅转交 swag-openapi-maintainer-rules。
commands:
  query: python package-structure-rules/scripts/placement_catalog.py query
  render: python package-structure-rules/scripts/placement_catalog.py render --all
  check: python package-structure-rules/scripts/placement_catalog.py check --policy strict
  adoption: python package-structure-rules/scripts/placement_catalog.py check --policy adoption --adoption-manifest doc/1-架构/3-目录规则收敛清单.yaml
