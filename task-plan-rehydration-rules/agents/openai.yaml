interface:
  display_name: "任务计划断点恢复"
  short_description: "保存并恢复 Codex Desktop 悬浮任务列表"
  default_prompt: "使用 $task-plan-rehydration-rules 管理 Codex Desktop 悬浮任务列表：PROJECT_CURRENT 使用 v4 registry 按原始 session_id 隔离多个会话投影。Goal、普通会话及 Plan Mode 默认展示尽量细化、可独立检查的步骤，不压成开始/执行/完成；步骤多时保留完整清单供滚动查看。默认执行模式取得 confirmed 后，首次领域动作前先用 ensure-start（显式 session-id 优先、CODEX_THREAD_ID 回退）持久化当前 session 的 active/blocked projection，下一动作立即把返回 payload 传给 update_plan；UI 同步失败时进入 UI_SYNC_BLOCKED，保留已持久化的磁盘状态并继续领域执行，在后续检查点重试 UI。Codex 未注册 update_plan 时先检查用户级和项目级 config.toml 的 [tools.update_plan].enabled；Codex CLI 0.152.0 起该工具默认关闭，配置启用后仍需核对当前会话工具注册与原生显示。原生清单未实际显示前不得报告显示验收通过。Goal 的 create/get/update 成功后，按已确认的任务工作项生成经过脱敏的 GOAL-## 连续步骤；至少使用十步细化默认清单作为基线，若任务需要则继续拆细，只有缺少任务专属内容时才直接使用通用默认步骤。通过 goal CLI 或受控 write 输入持久化细化清单，不保存 Goal 原文，再由主会话调用 update_plan；blocked 只显示观察列表，complete 先返回一次性完成收口 payload 再失活。正式最小任务优先并只替换当前会话 Goal 清单。读取旧版固定三步 Goal 时按投影契约映射到新版细化清单。继续场景按 session_id 校验活动投影，缺失时以 exact 或 fallback 补建。十分钟仅用于无步骤显示的异常补救；已真实执行且当前会话尚未确认原生清单成功同步时，扣除 Plan Mode、等待用户、blocked 和 manual_handoff 后严格超过 600 秒，在首个可执行检查点立即调用只读 probe-timeout。无活动投影按原流程补建；already_active 说明磁盘有步骤但 UI 可能未同步，调用 ensure-timeout 取回唯一现有 payload 并重试 update_plan，不创建 Goal、不覆盖投影；UI 失败继续领域任务。仅 goal_check_required 时由主 Agent 按 get_goal -> 复用匹配 Goal 或 create_goal 一次 -> goal create -> update_plan 执行；摘要单行中文且不超过 80 字，必须脱敏且不得落盘。Goal 不匹配、不可用、失败或结果不明确时禁止重复创建，降级原 ensure-timeout 普通 exact/fallback 投影。Plan Mode 不调用 Goal CLI；默认通过原生计划流程展示细化步骤，当前会话若提供 update_plan 可同步。许可不足、任务完成或计时丢失时不执行 Goal 超时路由。"
