interface:
  display_name: "任务计划断点恢复"
  short_description: "保存并恢复 Codex Desktop 悬浮任务列表"
  default_prompt: "使用 $task-plan-rehydration-rules 管理 Codex Desktop 悬浮任务列表：Goal 的 create/get/update 成功后，先用 goal CLI 持久化或恢复不含 Goal 原文的安全三步，再由主会话调用 update_plan；Goal blocked 只显示观察列表且不恢复执行权，Goal complete 必须失活且不生成 payload。正式最小任务优先并可替换 Goal 安全三步。继续场景优先校验 PROJECT_CURRENT 活动投影；托管投影缺失时先派只读子代理收集证据，再用 synthesize 生成 exact 或 fallback 投影。Plan Mode 不读取、写入或刷新投影。"
