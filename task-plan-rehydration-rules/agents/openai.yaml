interface:
  display_name: "任务计划断点恢复"
  short_description: "保存并恢复 Codex Desktop 悬浮任务列表"
  default_prompt: "使用 $task-plan-rehydration-rules 管理 Codex Desktop 悬浮任务列表：PROJECT_CURRENT 使用 v4 registry 按原始 session_id 隔离多个会话投影。默认执行模式取得 confirmed 后，首次领域动作前先用 ensure-start（显式 session-id 优先、CODEX_THREAD_ID 回退）持久化当前 session 的 active/blocked projection，下一动作立即把返回 payload 传给 update_plan；失败进入 UI_SYNC_BLOCKED，保留磁盘状态并停止领域写入。Goal 的 create/get/update 成功后，先用带 session-id 的 goal CLI 持久化或恢复不含 Goal 原文的安全三步，再由主会话调用 update_plan；blocked 只显示观察列表，complete 先返回一次性完成收口 payload 再失活。正式最小任务优先并只替换当前会话 Goal 安全三步。继续场景按 session_id 校验活动投影，缺失时以 exact 或 fallback 补建。十分钟仅用于缺失 projection 的异常修复；已真实执行且仍无活动或阻断投影时，扣除 Plan Mode、等待用户、blocked 和 manual_handoff 后严格超过 600 秒才先调用只读 probe-timeout。仅 goal_check_required 时由主 Agent 按 get_goal -> 复用匹配 Goal 或 create_goal 一次 -> goal create -> update_plan 执行；摘要单行中文且不超过 80 字，必须脱敏且不得落盘。Goal 不匹配、不可用、失败或结果不明确时禁止重复创建，降级原 ensure-timeout 普通 exact/fallback 投影。Plan Mode、许可不足、任务完成或计时丢失时不调用 Goal 或 update_plan。"
