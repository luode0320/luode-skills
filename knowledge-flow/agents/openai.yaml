interface:
  display_name: "知识流"
  short_description: "分层管理项目四件套与知识库知识流"
  default_prompt: >-
    使用 $knowledge-flow 时，先读取项目父目录规则、PROJECT_CURRENT.md 和
    PROJECT_MEMORY.md；缺失项目记忆文件时先创建，PROJECT_HISTORY.md 只在历史追问、状态不足
    或真实卡点时窄读。项目本地 Markdown 与知识库不混用；只有判定为 知识库:检索
    或 知识库:沉淀 时，才通过标准文件工具读写 D:\谷歌云盘\知识库\ 目录。
    写入前必须显式判定 补充 / 矛盾未裁决 / 取代 三态之一：判为取代时，先查 backlinks 引用数，再按分级处置把旧笔记
    标记已取代、或归档到 90-Archive/、或删除，同时给新笔记写接替关系，形成双向关系；只写新笔记不处置旧笔记是禁止行为。
    检索命中已取代或已归档笔记时顺着接替关系跳到接替笔记，旧笔记只作历史上下文。
    执行案例笔记不适用分级处置，仍只能追加状态事件。清理已积压冲突用只读巡检 audit_vault_knowledge.py --json，
    它只出候选不做写入；每次写入都要登记引用台账并在最终总结的知识引用小节如实报告。
