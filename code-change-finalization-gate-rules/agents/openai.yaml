interface:
  display_name: "代码变更收口闸门"
  short_description: "本轮存在代码/测试改动时的最终收口闸门：注释 Owner、根 test 归位、6-review、真实运行验证与 router 检查"
  default_prompt: "使用 $code-change-finalization-gate-rules 在本轮存在代码新增/修改且准备最终回复前执行收口闸门：1) 强制读取并消费 `comment-rules` 补齐闸门分区的 PASS/FAIL、缺口和证据；详细注释字段只由注释链 Owner 定义，本 skill 不复制；2) 任一注释闸门为 FAIL 时直接判定未通过；3) 核验真实测试完成后是否执行 `6-review` 并取得 STYLE: PASS；4) 核验功能代码改动是否完成真实运行验证，仅静态验证时不得给“已验证可用”结论；5) 新增测试文件必须位于根 `test/` 的镜像路径，Python 使用 `*_test.py`，Go 使用 ASCII 外部黑盒包；6) 若改动包含 `internal/router`，执行提交前风格闸门检查；7) 若出现用户手改与上下文冲突，确认已执行 `code-context-resync-rules` 且未回退用户手改。本 skill 只输出 PASS/FAIL、缺失字段和证据，不得输出用户可见的阻断区块、后续内容或解决计划；其他 Skill 的整体执行完整性与运行时状态真收口由 `skill-execution-compliance-gate-rules` 负责。"
