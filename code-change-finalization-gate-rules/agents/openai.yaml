interface:
  display_name: "代码变更收口闸门"
  short_description: "本轮存在代码/测试改动时的最终收口闸门：注释链、根 test 归位、污染扫描、6-review、真实运行验证"
  default_prompt: "使用 $code-change-finalization-gate-rules 在本轮存在代码新增/修改且准备最终回复前执行收口闸门：1) 消费 `comment-rules` 的注释链结论，任一注释闸门未补齐直接判定未通过，注释字段只由注释链 Owner 定义；2) 新增测试文件必须位于根 `test/` 的镜像路径，Python 使用 `*_test.py`，Go 使用 ASCII 外部黑盒包；3) 运行 `python test-strategy-rules/scripts/scan_test_pollution.py --root . --diff-only`，`POLLUTION: FAIL` 且未登记豁免为阻断；4) 核验真实测试完成后是否执行 `6-review` 并取得 STYLE: PASS；5) 核验功能代码改动是否完成真实运行验证，仅静态验证时不得给“已验证可用”结论；6) 若改动包含 `internal/router`，执行提交前风格闸门；7) 清理本轮测试资产与后台进程。本轮无代码改动但命中多个 skill 时，只检查已命中 skill 当前阶段的必需动作是否真实完成。"
