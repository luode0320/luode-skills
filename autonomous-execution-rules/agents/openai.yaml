interface:
  display_name: "自主连续执行规则"
  short_description: "Auto-continue tasks and pause only at key decision points"
  default_prompt: "使用 $autonomous-execution-rules 自动推进多步骤任务：确认计划和执行许可后连续执行，进度用宿主任务工具（TaskCreate/TaskUpdate）展示，宿主无任务工具时只靠任务计划文档状态字段。Goal 的 create/get/update 只改变运行时状态，不改变执行许可。只有原计划内必需动作才能自动继续，不得把可选优化升级为新任务。普通模式开工缺少正式计划、完成定义、停止条件和最大推进边界时不得实现；用户显式开启或确认且仍 active 的 Goal 若发现计划文档缺项，先按 Goal Owner 自主补齐并落盘，再继续，不因文档缺项单独阻断 Goal。每个最小任务独立完成实施计划完成条件、实现、真实测试和 `6-review` 风格回归；用户显式 Goal 范围内且满足 Goal Owner 全部低风险条件的必需授权默认通过；系统/平台/工具强制审批、高风险或不可逆、越界扩权、Git 未授权、真实 blocked/manual_handoff 或用户结束时暂停并按既有收口契约处理。无合法后续时直接结束。"
