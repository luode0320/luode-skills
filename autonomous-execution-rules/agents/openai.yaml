interface:
  display_name: "自主连续执行规则"
  short_description: "Auto-continue tasks and pause only at key decision points"
  default_prompt: "使用 $autonomous-execution-rules 自动推进多步骤任务：确认计划和执行许可后，每次任务状态迁移先调用 $task-plan-rehydration-rules 原子更新 PROJECT_CURRENT，再真实调用 update_plan；Goal 的 create/get/update 只交接细化默认步骤投影，不改变执行许可，blocked 仅用于观察进度，complete 必须失活。只有原计划内必需动作才能自动继续，不得把可选优化升级为新任务。普通模式开工缺少正式计划、完成定义、停止条件和最大推进边界时不得实现；用户显式开启或确认且仍 active 的 Goal 若发现计划文档缺项，先按 Goal Owner 自主补齐并落盘，再继续，不因文档缺项单独阻断 Goal。每个最小任务独立完成实施计划完成条件、实现、真实测试和 `6-review` 风格回归；用户显式 Goal 范围内且满足 Goal Owner 全部低风险条件的必需授权默认通过；系统/平台/工具强制审批、高风险或不可逆、越界扩权、Git 未授权、真实 blocked/manual_handoff 或用户结束时暂停并按既有收口契约处理。任务完成后先把投影置为 inactive，再按运行时机制真实结束状态；无合法后续时直接结束。"
