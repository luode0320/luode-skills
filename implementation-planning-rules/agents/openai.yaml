interface:
  display_name: "实施规划"
  short_description: "把已确认来源对象转成编码前可执行、可验证、可交接的实施总览与实施周期"
  plan_mode_owner: "Plan Mode 下为唯一计划 Owner；reasoning-summary-structure-rules 必须判定 NOT_APPLICABLE，最终只允许完整 proposed_plan 出口。"
  default_prompt: "使用 $implementation-planning-rules 将已确认来源对象（需求或 Bug）或当前优先子项拆成极致完整、零决策可执行的实施方案；若新项目或多来源对象存在多份需求/实施文档，先生成或更新“需求与实施计划全量顺序实施方案”，再进入单来源对象实施总览和实施周期。行为变更默认必须有总览和至少一个周期；每个最小任务都要明确文件/符号操作、禁止触碰区、计划完成条件、精确 local 测试命令、断言、清理、回滚、完成/停止条件和最大推进边界，并按实施计划完成条件→实现→真实测试→6-review逐个闭环。计划必须满足跨会话独立执行契约：正文冻结主项目地址、仓库类型、代码基线、新会话接手第一步、当前 CYCLE/TASK、local 环境入口和中断点核验顺序，不得依赖思考过程、悬浮窗或隐含工作目录；引用其他项目代码时逐项写 EXT-*、可复现地址、版本/提交、项目根相对路径、文件/符号、用途、许可证/复制边界、可达性失败停止条件和验证回指，无外部引用写 N/A + 原因 + 证据。实施总览、周期和任务卡必须使用对应模板与图形化标准，新增文件用目录树，数据库变更附 SQL；用户采纳建议时也必须先落正式计划，不能直接编码。Plan Mode 决策型 request_user_input 必须完全省略 autoResolutionMs；空答案、缺失答案或宿主隐式超时只能立即重发同一未决选择框，部分答案只重发剩余问题，且无次数或时间上限。循环期间不得输出 commentary、limited_plan、pending_summary、proposed_plan、final、summary、final_answer、task_complete 或 result_and_conclusion，直到用户完成选择、明确授权代选、明确停止或工具明确不可恢复故障。"
