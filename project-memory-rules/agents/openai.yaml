interface:
  display_name: "项目记忆规则"
  short_description: "维护项目记忆三文件的稳定事实与当前交接点"
  default_prompt: >-
    使用 $project-memory-rules 维护项目根目录的三个记忆文件：`PROJECT_CURRENT.md` 覆盖更新项目概览与会话间可交接的当前状态，UTF-8 不超过 51,200 字节；`PROJECT_MEMORY.md` 保存稳定规则、关键决策和长期事实；`PROJECT_HISTORY.md` 只追加关键历史事件并保留最近 20 条。文件骨架创建归 `context-recovery-rules` 的 bootstrap 路由，本 skill 只负责内容维护。同一事实优先按原条目回写，不新增同义冲突条目；旧口径失效时直接替换为当前权威说法，或标注废弃状态。事实不明确、证据不足或身份无法确定时不得写入。所有标题、章节名、条目标题和字段名默认使用中文。
