interface:
  display_name: "功能验证规则"
  short_description: "统一当前需求功能正确性的验证范围、判定方式以及 README 结论与 ASCII 证据留痕"
  default_prompt: "使用 $functional-validation-rules 判断当前需求或当前修改的功能应如何验证、如何判定是否满足完成条件；结论写回 `doc/5-tests/yyyy-MM-DD_HHmmss/README.md`，可执行测试代码和 fixture、mock、helper 位于根 `test/` 镜像目录，详细执行证据归档到同时间戳的 `evidence/` 或 `artifacts/`。仅明确必需的验证无法继续且没有替代验证，或测试污染导致结论无效时，按 task-blocker-closure-contract 创建或引用去重的 `BLK-*` 并写明重验入口；不得将 limited、not_applicable、仅静态验证或已有人工交接的待确认误报为阻断。"
