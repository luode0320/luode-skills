interface:
  display_name: "回归验证规则"
  short_description: "以 test-strategy-rules 的 test-asset-governance 条件路由为基准，统一回归范围判定、README 结论与双根证据留痕"
  default_prompt: "使用 $test-regression-rules 判断当前改动需要回归哪些旧能力、应选择哪些回归用例；回归结论写回 `doc/5-tests/yyyy-MM-DD_HHmmss/README.md`，活动回归测试代码、fixture、mock 和 helper 位于根 `test/` 镜像目录，详细案例和证据归档到同时间戳的 `evidence/` 或 `artifacts/`。"
